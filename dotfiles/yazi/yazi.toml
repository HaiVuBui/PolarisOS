[opener]
# Define Zathura
zathura = [
	{ run = 'zathura "$@"', desc = "Zathura", orphan = true, for = "unix" }
]

# Define Sioyek
sioyek = [
	{ run = 'sioyek "$@"', desc = "Sioyek", orphan = true, for = "unix" }
]

[open]
prepend_rules = [
    { mime = "application/pdf", use = [ "zathura", "sioyek" ] },
]
